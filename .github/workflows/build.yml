name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build MetaTagMenu.csproj -c Release -o out

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MetaTagMenu
          path: out/MetaTagMenu.dll
